<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Manaar</title>
    <style>
        body {
            background: #0f0000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            font-family: 'Georgia', serif;
            color: white;
            overflow-x: hidden;
        }

        /* Photo Section */
        .photo-gallery {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            padding: 10px;
        }

        .photo-gallery img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 3px solid white;
            border-radius: 10px;
            transform: rotate(-5deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .photo-gallery img:nth-child(2) {
            transform: rotate(5deg);
            margin-top: 10px;
        }

        .header h1 {
            color: #ff4d4d;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Flip Cards */
        .card-container {
            width: 300px;
            height: 180px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #ff4d4d;
            text-align: center;
        }

        .card-front {
            background: #1a0505;
            color: #ffcccc;
        }

        .card-back {
            background: #ff4d4d;
            color: white;
            transform: rotateY(180deg);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="photo-gallery">
        <img src="pic1.jpg" alt="Us">
        <img src="pic2.jpg" alt="Us">
        <img src="pic3.jpg" alt="Us">
    </div>

    <div class="header">
        <h1>Propose Day, Manaar</h1>
    </div>

    <div class="card-container" onclick="this.classList.toggle('flipped')">
        <div class="card-inner">
            <div class="card-front">A question for you...</div>
            <div class="card-back">I know we are miles apart right now, but would you let me be the one who makes you smile every day for the rest of our lives?</div>
        </div>
    </div>

    <div class="card-container" onclick="this.classList.toggle('flipped')">
        <div class="card-inner">
            <div class="card-front">Why you?</div>
            <div class="card-back">Because nobody else sees the world the way you do, and nobody else makes me feel like I'm finally home.</div>
        </div>
    </div>

</body>
</html>
